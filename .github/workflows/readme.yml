# Rebuilds the README images every day so the Activity graph stays current,
# and whenever the build script or its inputs change on main.
name: Refresh README

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "assets/src/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/readme.yml"

permissions:
  contents: write

concurrency:
  group: readme
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Commit changes
        run: |
          git add README.md assets
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Refresh README"
          git push
